apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app-back.fullname" . }}-web
  labels:
    {{- include "app-back.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "app-back.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "app-back.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        # Roll pods when config/nginx ConfigMap changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "app-back.fullname" . }}-web
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        # --- php-fpm (application runtime) ---------------------------------
        - name: php-fpm
          image: {{ include "app-back.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["php-fpm", "-F"]
          ports:
            - name: fpm
              containerPort: {{ .Values.web.phpFpmPort }}
            - name: metrics
              containerPort: 9091
          envFrom:
            {{- include "app-back.envFrom" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.web.resources.php | nindent 12 }}
          volumeMounts:
            - { name: storage,  mountPath: /var/www/html/storage }
            - { name: fpm-run,  mountPath: /run }
            - { name: tmp,      mountPath: /tmp }
        # --- nginx (SPA static + /api,/up proxy) ---------------------------
        - name: nginx
          image: {{ include "app-back.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["nginx", "-g", "daemon off;"]
          ports:
            - name: http
              containerPort: {{ .Values.web.nginxPort }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.web.resources.nginx | nindent 12 }}
          startupProbe:
            httpGet: { path: {{ .Values.web.probes.path }}, port: http }
            {{- toYaml .Values.web.probes.startup | nindent 12 }}
          readinessProbe:
            httpGet: { path: {{ .Values.web.probes.path }}, port: http }
            {{- toYaml .Values.web.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet: { path: {{ .Values.web.probes.path }}, port: http }
            {{- toYaml .Values.web.probes.liveness | nindent 12 }}
          volumeMounts:
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d }
            - { name: nginx-run,  mountPath: /run }
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: tmp,        mountPath: /tmp }
      volumes:
        # readOnlyRootFilesystem=true -> every writable path is an emptyDir.
        - { name: storage,     emptyDir: {} }
        - { name: fpm-run,     emptyDir: {} }
        - { name: nginx-run,   emptyDir: {} }
        - { name: nginx-cache, emptyDir: {} }
        - { name: tmp,         emptyDir: {} }
        - name: nginx-conf
          configMap:
            name: {{ include "app-back.fullname" . }}-nginx
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
