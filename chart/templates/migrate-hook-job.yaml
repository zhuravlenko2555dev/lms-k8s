{{- if .Values.migrations.enabled }}
# Pre-upgrade / pre-install Helm hook: runs `migrate --force` exactly once per
# release BEFORE the new web/worker pods roll. A failure here aborts the
# upgrade, so a bad migration never reaches a serving pod. This is the ONLY
# place migrations run automatically — rollback is always a separate manual Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "app-back.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "app-back.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    # ArgoCD equivalent so it works under GitOps sync too.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "app-back.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "app-back.fullname" . }}-migrate
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "app-back.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["php", "artisan", "migrate", "--force", "--no-interaction"]
          envFrom:
            {{- include "app-back.envFrom" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
{{- end }}
