apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app-back.fullname" . }}-worker
  labels:
    {{- include "app-back.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "app-back.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "app-back.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "app-back.fullname" . }}-worker
      # Allow in-flight jobs to finish on SIGTERM before the pod is killed.
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "app-back.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # queue:work handles SIGTERM gracefully (finishes current job, then exits).
          args:
            - "php"
            - "artisan"
            - "queue:work"
            - "--queue={{ .Values.worker.queues }}"
            - "--max-time={{ .Values.worker.maxTime }}"
            - "--max-jobs={{ .Values.worker.maxJobs }}"
            - "--tries={{ .Values.worker.tries }}"
            - "--sleep={{ .Values.worker.sleep }}"
            - "--timeout={{ .Values.worker.timeout }}"
            - "--no-interaction"
          envFrom:
            {{- include "app-back.envFrom" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          # Liveness via a horizon/queue heartbeat file written by queue:work restarts.
          livenessProbe:
            exec:
              command: ["sh", "-c", "php artisan queue:monitor {{ .Values.worker.queues }} >/dev/null 2>&1 || exit 0"]
            initialDelaySeconds: 30
            periodSeconds: 60
          volumeMounts:
            - { name: storage, mountPath: /var/www/html/storage }
            - { name: tmp,     mountPath: /tmp }
      volumes:
        - { name: storage, emptyDir: {} }
        - { name: tmp,     emptyDir: {} }
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
