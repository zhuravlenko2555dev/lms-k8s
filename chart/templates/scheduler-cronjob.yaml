{{- if .Values.scheduler.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "app-back.fullname" . }}-scheduler
  labels:
    {{- include "app-back.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  schedule: {{ .Values.scheduler.schedule | quote }}
  # Never run two scheduler ticks at once.
  concurrencyPolicy: {{ .Values.scheduler.concurrencyPolicy }}
  startingDeadlineSeconds: {{ .Values.scheduler.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A schedule tick should be quick; kill runaway ticks well before the next.
      activeDeadlineSeconds: 55
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "app-back.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: scheduler
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "app-back.fullname" . }}-scheduler
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          imagePullSecrets:
            {{- toYaml .Values.imagePullSecrets | nindent 12 }}
          containers:
            - name: scheduler
              image: {{ include "app-back.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: ["php", "artisan", "schedule:run", "--no-interaction"]
              envFrom:
                {{- include "app-back.envFrom" . | nindent 16 }}
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              resources:
                {{- toYaml .Values.scheduler.resources | nindent 16 }}
              volumeMounts:
                - { name: storage, mountPath: /var/www/html/storage }
                - { name: tmp,     mountPath: /tmp }
          volumes:
            - { name: storage, emptyDir: {} }
            - { name: tmp,     emptyDir: {} }
{{- end }}
