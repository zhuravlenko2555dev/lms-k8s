# App namespaces enforce Pod Security Admission "restricted" (the strictest
# built-in profile): no privileged/hostPath/hostNetwork pods, non-root only,
# seccomp required, caps dropped. warn+audit also set so violations are logged.
apiVersion: v1
kind: Namespace
metadata:
  name: app-dev
  labels:
    kubernetes.io/metadata.name: app-dev
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: app-prod
  labels:
    kubernetes.io/metadata.name: app-prod
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# Bound total resource consumption per env so a runaway dev cannot starve prod.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: app-dev-quota
  namespace: app-dev
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "40"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: app-prod-quota
  namespace: app-prod
spec:
  hard:
    requests.cpu: "12"
    requests.memory: 24Gi
    limits.cpu: "24"
    limits.memory: 48Gi
    pods: "80"
---
# Default per-container requests/limits so a pod without explicit resources is
# still bounded (defense in depth alongside the chart's explicit resources).
apiVersion: v1
kind: LimitRange
metadata:
  name: app-dev-limits
  namespace: app-dev
spec:
  limits:
    - type: Container
      default: { cpu: "500m", memory: 512Mi }
      defaultRequest: { cpu: "100m", memory: 128Mi }
---
apiVersion: v1
kind: LimitRange
metadata:
  name: app-prod-limits
  namespace: app-prod
spec:
  limits:
    - type: Container
      default: { cpu: "500m", memory: 512Mi }
      defaultRequest: { cpu: "100m", memory: 128Mi }
---
# Platform-component namespaces. Created here at wave -1 so they exist BEFORE any
# SealedSecret or component that targets them (previously each app created its own
# lazily via CreateNamespace=true, which broke `kubectl apply -f secrets/` and any
# cross-namespace ordering). Deliberately NOT PSA=restricted: node-exporter
# (monitoring) needs hostPath/hostNetwork, and the bitnami redis/mysql + seaweedfs
# charts assume relaxed defaults — restricted would reject their pods. Tighten to
# baseline per-namespace later if each chart's securityContext allows it.
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels: { kubernetes.io/metadata.name: cert-manager }
---
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
  labels: { kubernetes.io/metadata.name: traefik }
---
apiVersion: v1
kind: Namespace
metadata:
  name: sealed-secrets
  labels: { kubernetes.io/metadata.name: sealed-secrets }
---
apiVersion: v1
kind: Namespace
metadata:
  name: seaweedfs
  labels: { kubernetes.io/metadata.name: seaweedfs }
---
apiVersion: v1
kind: Namespace
metadata:
  name: registry
  labels: { kubernetes.io/metadata.name: registry }
---
apiVersion: v1
kind: Namespace
metadata:
  name: redis
  labels: { kubernetes.io/metadata.name: redis }
---
apiVersion: v1
kind: Namespace
metadata:
  name: mysql
  labels: { kubernetes.io/metadata.name: mysql }
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels: { kubernetes.io/metadata.name: monitoring }
