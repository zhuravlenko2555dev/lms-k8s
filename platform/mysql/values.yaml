# MySQL 8.4 (official docker.io/mysql image) via the groundhog2k/mysql chart.
# Credentials come from the SealedSecret 'mysql-auth', mounted as env vars the
# official image understands (MYSQL_ROOT_PASSWORD / MYSQL_PASSWORD) plus
# BACKUP_DB_PASSWORD used by the init script below. The app connects as the app
# user (never root); backups use the SELECT-only 'backup' user.
image:
  registry: docker.io
  repository: mysql
  tag: "8.4"                            # LTS line; pinned (chart appVersion is 9.x)

# The app database + app user are created on first init by the official image.
# Non-secret values live here; the passwords come from mysql-auth (extraEnvSecrets).
env:
  - name: MYSQL_DATABASE
    value: app-back
  - name: MYSQL_USER
    value: app-back

# Mount the SealedSecret as env vars. mysql-auth MUST provide (see secrets/tmp):
#   MYSQL_ROOT_PASSWORD, MYSQL_PASSWORD, BACKUP_DB_PASSWORD
extraEnvSecrets:
  - mysql-auth

# Least-privilege backup user, created on first init. A .sh (not .sql) script so
# ${BACKUP_DB_PASSWORD} / ${MYSQL_ROOT_PASSWORD} env vars expand.
customScripts:
  01-backup-user.sh: |
    #!/bin/bash
    set -e
    mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" <<-SQL
      CREATE USER IF NOT EXISTS 'backup'@'%' IDENTIFIED BY '${BACKUP_DB_PASSWORD}';
      GRANT SELECT, LOCK TABLES, SHOW VIEW, EVENT, TRIGGER, PROCESS, RELOAD
        ON *.* TO 'backup'@'%';
      FLUSH PRIVILEGES;
    SQL

service:
  type: ClusterIP
  port: 3306

storage:
  requestedSize: 20Gi                   # dynamically-provisioned PVC

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits:   { cpu: "2", memory: 2Gi }
