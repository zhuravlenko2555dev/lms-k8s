# cert-manager install values.
installCRDs: true
global:
  leaderElection:
    namespace: cert-manager
# Restricted-PSA compatible, non-root, metrics for Prometheus.
securityContext:
  runAsNonRoot: true
prometheus:
  enabled: true
  servicemonitor:
    enabled: true
resources:
  requests: { cpu: 10m, memory: 64Mi }
  limits:   { cpu: 200m, memory: 256Mi }
