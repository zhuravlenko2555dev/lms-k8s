# Wave 0. Sealed Secrets controller. It holds the cluster's private key and is
# the ONLY thing that can decrypt SealedSecrets — so encrypted secrets can live
# safely in Git. Back up its key (see docs/USAGE.md); losing it means resealing.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  sources:
    - repoURL: https://bitnami.github.io/sealed-secrets
      chart: sealed-secrets
      targetRevision: 2.15.3            # pin
      helm:
        releaseName: sealed-secrets
        valueFiles: [$values/platform/sealed-secrets/values.yaml]
    - repoURL: git@github.com:zhuravlenko2555dev/lms-k8s.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
