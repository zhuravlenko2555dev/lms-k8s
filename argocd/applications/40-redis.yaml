# Wave 3. Redis 7.4 (official docker.io/redis image) for cache, sessions and
# queues, via the groundhog2k/redis chart. Bitnami's chart/images were dropped in
# the 2025 catalog teardown, so we use the official upstream image. releaseName
# 'redis' -> Service 'redis' (config REDIS_HOST points at redis.redis.svc).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: platform
  sources:
    - repoURL: https://groundhog2k.github.io/helm-charts
      chart: redis
      targetRevision: 2.4.6             # pin (official redis image)
      helm:
        releaseName: redis              # -> Service 'redis'
        valueFiles: [$values/platform/redis/values.yaml]
    - repoURL: git@github.com:zhuravlenko2555dev/lms-k8s.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: redis
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
