# Wave 3. kube-prometheus-stack: Prometheus + Grafana + Alertmanager +
# node-exporter + kube-state-metrics. Extra exporters (mysqld/redis) ship with
# their charts above; dashboards are provisioned as ConfigMaps (sidecar).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: platform
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 61.3.2            # pin
      helm:
        releaseName: kube-prometheus-stack
        valueFiles: [$values/platform/monitoring/values.yaml]
    - repoURL: git@github.com:zhuravlenko2555dev/lms-k8s.git
      targetRevision: main
      ref: values
    - repoURL: git@github.com:zhuravlenko2555dev/lms-k8s.git
      targetRevision: main
      path: platform/monitoring/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
